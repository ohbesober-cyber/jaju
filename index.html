<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자주 쓰는 말</title>
<meta name="description" content="자주 쓰는 문구를 저장해 두고 누르면 바로 복사합니다.">
<meta name="theme-color" content="#3b6cff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자주 쓰는 말">
<style>
/* 레이아웃: 엄지로 누르는 큰 문구 버튼이 한 줄에 하나씩. 누르면 복사, 편집은 따로 켠다. 밝은 단일 테마, 문구마다 옅은 색을 번갈아 쓴다. */
:root{
  --bg:#fbfcff;
  --surface:#ffffff;
  --ink:#1c2433;
  --muted:#6b7689;
  --line:#e3e8f2;
  --accent:#3b6cff;
  --accent-ink:#ffffff;
  --good:#0f9d66;
  --warn:#b7791f;
  --bad:#e0483a;
  --t1:#eef4ff; --t2:#eafaf2; --t3:#fff5e6; --t4:#ffeef3; --t5:#f2efff;
  --font-display:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --font-body:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%}
.wrap{max-width:560px; margin:0 auto; padding:20px 16px 56px; display:flex; flex-direction:column; gap:12px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{font-family:var(--font-display); font-size:1.375rem; font-weight:700; margin:0}
p{margin:0}
.sub{color:var(--muted); font-size:.875rem}
.chip{display:inline-block; font-size:.75rem; font-weight:600; padding:2px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.chip.good{color:var(--good); border-color:currentColor}
.chip.warn{color:var(--warn); border-color:currentColor}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.grow{flex:1 1 0; min-width:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0}
.phrase{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left;
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; min-height:56px;
}
.phrase .tx{white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.phrase .st{font-size:.8125rem; font-weight:600; color:var(--accent); white-space:nowrap}
.list .phrase:nth-of-type(5n+1){background:var(--t1)}
.list .phrase:nth-of-type(5n+2){background:var(--t2)}
.list .phrase:nth-of-type(5n+3){background:var(--t3)}
.list .phrase:nth-of-type(5n+4){background:var(--t4)}
.list .phrase:nth-of-type(5n+5){background:var(--t5)}
.phrase{border-color:transparent; box-shadow:0 1px 2px rgba(28,36,51,.06)}
.phrase.done{border-color:var(--good)}
.phrase.done .st{color:var(--good)}
.phrase:active{filter:brightness(.96)}
textarea{width:100%; min-height:84px; resize:vertical; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn{font:inherit; font-weight:600; padding:10px 14px; border-radius:10px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.small{padding:6px 10px; font-size:.8125rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4; cursor:default}
.note{font-size:.875rem; padding:10px 12px; border-radius:10px; border:1px solid var(--warn); color:var(--warn); background:var(--bg)}
.list{display:flex; flex-direction:column; gap:12px}
.list .card{grid-column:1 / -1}
label{font-size:.8125rem; color:var(--muted)}
/* 작게 보기: 창 높이가 낮으면 자동으로, 또는 "작게 보기"를 켜 두면 창 크기와 상관없이 항상.
   제목 줄을 없애고, 문구를 글자 길이만큼만 차지하는 작은 칩으로 줄지어 깐다 */
.mini-edit{display:none}
.compact .wrap{padding:18px 6px 6px; gap:4px}   /* 위쪽 여백: 분할 화면 창의 손잡이가 문구를 가리지 않게 */
.compact header, .compact .hint, .compact .foot{display:none}
.compact .list{display:flex; flex-direction:row; flex-wrap:wrap; gap:4px}
.compact .phrase{display:block; width:auto; max-width:100%; flex:0 1 auto; padding:4px 9px; min-height:30px; border-radius:8px; font-size:.875rem; line-height:1.55; box-shadow:none}
.compact .phrase .tx{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.compact .phrase .st{display:none}
.compact .list .phrase.done{background:var(--good); color:var(--surface)}
.compact .mini-edit{display:block; font:inherit; font-size:.75rem; font-weight:600; color:var(--muted); background:transparent; border:1px dashed var(--line); border-radius:8px; padding:4px 9px; min-height:30px; cursor:pointer}
.compact .list .card{flex:1 1 100%}
.compact .note{padding:4px 8px; font-size:.75rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  var KEY = 'phrases-v1', MAX = 20;
  var S = { ready: false, mode: 'local', failed: false, items: [], edit: false, copied: null, manual: null, note: '' };
  var EXAMPLES = ['(예시) 안녕하세요, 문의 주셔서 감사합니다.', '(예시) 확인 후 바로 연락드리겠습니다.', '(예시) 오늘 수업은 정상적으로 진행됩니다.',
                  '(예시) 입금 확인했습니다. 감사합니다.', '(예시) 죄송하지만 일정 변경이 가능할까요?'];

  function $(id) { return document.getElementById(id); }
  var forced = false, mq = window.matchMedia ? window.matchMedia('(max-height:520px)') : null;
  try { forced = localStorage.getItem('phrases-compact') === '1'; } catch (e) {}
  function applyMode() { document.body.classList.toggle('compact', forced || !!(mq && mq.matches)); }
  function setForced(v) { forced = v; try { localStorage.setItem('phrases-compact', v ? '1' : '0'); } catch (e) {} applyMode(); render(); }
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', applyMode); else if (mq.addListener) mq.addListener(applyMode); }
  window.addEventListener('resize', applyMode);
  function rid() { return 'p' + Math.random().toString(36).slice(2, 10); }
  function clean(d) {
    return (d && Array.isArray(d.items) ? d.items : []).slice(0, MAX).map(function (x) {
      return { id: typeof (x && x.id) === 'string' ? x.id.slice(0, 20) : rid(), text: String((x && x.text) || '').slice(0, 1000) }; });
  }
  function h(tag, a, kids) {
    var el = document.createElement(tag), val;
    if (a) for (var k in a) {
      var v = a[k];
      if (v == null || v === false) continue;
      if (k === 'text') el.textContent = v;
      else if (k === 'value') val = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'disabled') el.disabled = !!v;
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    (kids || []).forEach(function (c) { if (c == null || c === false) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    if (val !== undefined) el.value = val;
    return el;
  }

  // 저장: 이 기기의 브라우저 저장소
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ items: S.items })); }
    catch (e) { S.note = '저장하지 못했습니다. 브라우저의 저장 공간 설정을 확인해 주세요.'; }
  }
  var copyTimer = null;
  function copy(item) {
    var ok = function () {
      S.copied = item.id; S.manual = null; S.note = ''; render();
      clearTimeout(copyTimer); copyTimer = setTimeout(function () { S.copied = null; render(); }, 1500);
    };
    var no = function () { S.manual = item.id; S.copied = null; S.note = '자동 복사가 막혀 있습니다. 아래에 펼쳐진 문구를 길게 눌러 복사해 주세요.'; render(); var t = $('manual'); if (t) { t.focus(); t.select(); } };
    var legacy = function () {   // 내려받은 파일처럼 클립보드 API가 없는 환경용
      try {
        var t = document.createElement('textarea');
        t.value = item.text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;left:0;top:0;opacity:0;font-size:16px';
        document.body.appendChild(t); t.focus(); t.select(); t.setSelectionRange(0, t.value.length);
        var done = document.execCommand('copy'); document.body.removeChild(t);
        if (done) ok(); else no();
      } catch (e) { no(); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(item.text).then(ok, legacy);
      else legacy();
    } catch (e) { legacy(); }
  }

  function render() {
    var a = document.activeElement, fid = a && a.id, ss = null, se = null;
    try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) {}
    var root = $('app'); root.textContent = '';
    view().forEach(function (n) { if (n) root.appendChild(n); });
    if (fid) { var el = $(fid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} } }
  }
  function view() {
    var status = !S.ready ? ['연결 중', ''] : ['이 기기에 저장', 'good'];
    var head = h('header', null, [h('h1', { text: '자주 쓰는 말' }), h('span', { class: 'chip ' + status[1], text: status[0] })]);
    if (!S.ready) return [head, h('div', { class: 'card' }, [h('p', { class: 'sub', text: '불러오는 중입니다.' })])];
    var out = [head, S.note ? h('div', { class: 'note', role: 'status', text: S.note }) : null];
    var live = h('p', { class: 'sub hint', role: 'status', 'aria-live': 'polite', text: S.copied ? '복사했습니다. 원하는 곳에 붙여 넣으세요.' : (S.edit ? '문구를 고친 뒤 완료를 누르세요.' : (S.items.length ? '문구를 누르면 바로 복사됩니다.' : '')) });
    out.push(live);

    if (!S.items.length && !S.edit) {
      out.push(h('div', { class: 'card' }, [h('p', { text: '아직 저장한 문구가 없습니다.' }),
        h('div', { class: 'row' }, [
          h('button', { class: 'btn primary', type: 'button', id: 'add-first', text: '문구 추가', onclick: function () { S.items.push({ id: rid(), text: '' }); S.edit = true; render(); var t = $('tx-0'); if (t) t.focus(); } }),
          h('button', { class: 'btn', type: 'button', id: 'add-examples', text: '예시 문구 넣어 보기', onclick: function () { S.items = EXAMPLES.map(function (t) { return { id: rid(), text: t }; }); save(); render(); } })])]));
      return out;
    }

    if (!S.edit) {
      var list = h('div', { class: 'list' });
      out.push(list);
      S.items.forEach(function (it, i) {
        var done = S.copied === it.id;
        list.appendChild(h('button', { class: 'phrase' + (done ? ' done' : ''), type: 'button', id: 'ph-' + i, onclick: function () { copy(it); } },
          [h('span', { class: 'tx', text: it.text }), h('span', { class: 'st', text: done ? '복사됨' : '복사' })]));
        if (S.manual === it.id) list.appendChild(h('div', { class: 'card' }, [h('label', { for: 'manual', text: '직접 복사할 문구' }), h('textarea', { id: 'manual', readonly: true, value: it.text })]));
      });
      list.appendChild(h('button', { class: 'mini-edit', type: 'button', id: 'edit-mini', text: '편집', onclick: function () { S.edit = true; S.copied = null; S.manual = null; S.note = ''; render(); } }));
      if (forced) list.appendChild(h('button', { class: 'mini-edit', type: 'button', id: 'compact-off', text: '크게', onclick: function () { setForced(false); } }));
      out.push(h('div', { class: 'row foot' }, [h('button', { class: 'btn', type: 'button', id: 'edit-on', text: '문구 편집', onclick: function () { S.edit = true; S.copied = null; S.manual = null; S.note = ''; render(); } }),
        h('button', { class: 'btn', type: 'button', id: 'compact-on', text: '작게 보기', onclick: function () { setForced(true); } }),
        h('span', { class: 'sub', text: S.items.length + ' / ' + MAX + '개' })]));
      return out;
    }

    S.items.forEach(function (it, i) {
      out.push(h('div', { class: 'card' }, [
        h('label', { for: 'tx-' + i, text: (i + 1) + '번 문구' }),
        h('textarea', { id: 'tx-' + i, maxlength: '1000', value: it.text, oninput: function () { it.text = this.value; }, onchange: function () { save(); } }),
        h('div', { class: 'row' }, [
          h('button', { class: 'btn small', type: 'button', id: 'up-' + i, disabled: i === 0, 'aria-label': (i + 1) + '번 문구 위로', text: '위로', onclick: function () { S.items.splice(i - 1, 0, S.items.splice(i, 1)[0]); save(); render(); } }),
          h('button', { class: 'btn small', type: 'button', id: 'down-' + i, disabled: i === S.items.length - 1, 'aria-label': (i + 1) + '번 문구 아래로', text: '아래로', onclick: function () { S.items.splice(i + 1, 0, S.items.splice(i, 1)[0]); save(); render(); } }),
          h('span', { class: 'grow' }),
          h('button', { class: 'btn small danger', type: 'button', id: 'del-' + i, 'aria-label': (i + 1) + '번 문구 삭제', text: '삭제', onclick: function () { S.items.splice(i, 1); save(); render(); } })])]));
    });
    out.push(h('div', { class: 'row' }, [
      h('button', { class: 'btn', type: 'button', id: 'add', disabled: S.items.length >= MAX, text: '문구 추가', onclick: function () { S.items.push({ id: rid(), text: '' }); render(); var t = $('tx-' + (S.items.length - 1)); if (t) t.focus(); } }),
      h('button', { class: 'btn primary', type: 'button', id: 'edit-off', text: '완료', onclick: function () {
        S.items = S.items.filter(function (it) { it.text = it.text.trim(); return it.text; }); save(); S.edit = false; render(); } }),
      h('span', { class: 'sub', text: S.items.length + ' / ' + MAX + '개' })]));
    return out;
  }

  function startLocal() {
    S.mode = 'local';
    try { S.items = clean(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {}
    S.ready = true; render();
  }
  function init() { startLocal(); }
  applyMode();
  render();
  init();
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
})();
</script>
</body>
</html>
