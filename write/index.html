<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말로 쓰기</title>
<meta name="description" content="말하면 원고로 적히는 집필 도구입니다.">
<meta name="theme-color" content="#3b6cff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말로 쓰기">
<style>
/* 레이아웃: 화면 대부분이 원고. 위에는 제목과 글자 수, 아래에는 엄지로 누르는 큰 마이크와 자주 쓰는 편집 버튼. 밝은 단일 테마. */
:root{
  --bg:#fbfcff;
  --surface:#ffffff;
  --ink:#1c2433;
  --muted:#6b7689;
  --line:#e3e8f2;
  --accent:#3b6cff;
  --accent-ink:#ffffff;
  --live:#e0483a;
  --good:#0f9d66;
  --tint:#eef4ff;
  --font:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --font-text:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",system-ui,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%}
.app{height:100vh; height:100dvh; max-width:760px; margin:0 auto; display:flex; flex-direction:column; padding:8px 12px 10px; gap:8px}
.top{display:flex; gap:8px; align-items:center}
.top input{flex:1; min-width:0; font:inherit; font-weight:700; font-size:1.0625rem; color:var(--ink); background:transparent; border:0; border-bottom:1px solid transparent; padding:6px 2px}
.top input:focus{outline:none; border-bottom-color:var(--accent)}
.count{font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; line-height:1.3}
.btn{font:inherit; font-weight:600; font-size:.875rem; padding:8px 12px; border-radius:10px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink); white-space:nowrap}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.danger{color:var(--live)}
.btn:disabled{opacity:.4; cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#text{flex:1; min-height:0; width:100%; resize:none; font-family:var(--font-text); font-size:1.0625rem; line-height:1.85; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
#text.live{border-color:var(--live)}
.interim{min-height:1.5em; font-size:.875rem; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; direction:rtl; text-align:left}
.interim span{direction:ltr; unicode-bidi:plaintext}
.note{font-size:.8125rem; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--tint); color:var(--ink)}
.note.bad{border-color:var(--live); color:var(--live); background:var(--surface)}
.bar{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center}
.bar .side{display:flex; gap:6px; flex-wrap:wrap}
.bar .side.r{justify-content:flex-end}
#mic{width:64px; height:64px; border-radius:50%; border:0; cursor:pointer; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 2px 8px rgba(59,108,255,.35)}
#mic.on{background:var(--live); box-shadow:0 0 0 6px rgba(224,72,58,.18)}
#mic svg{width:28px; height:28px}
@media (prefers-reduced-motion:no-preference){ #mic.on{animation:pulse 1.4s ease-in-out infinite} }
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(224,72,58,.08)}}
.panel{position:fixed; inset:0; background:rgba(28,36,51,.35); display:flex; align-items:flex-end; justify-content:center; z-index:10}
.sheet{background:var(--surface); width:100%; max-width:760px; max-height:86dvh; overflow:auto; border-radius:18px 18px 0 0; padding:16px; display:flex; flex-direction:column; gap:12px}
.sheet h2{font-size:1rem; margin:0}
.doc{display:flex; gap:8px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.doc .grow{flex:1; min-width:0}
.doc .t{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.doc .m{font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums}
.doc.cur .t{color:var(--accent)}
.help{font-size:.875rem; color:var(--ink); margin:0; padding-left:18px}
.help li{margin:3px 0}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
[hidden]{display:none !important}
@media (max-height:460px){ .app{padding:4px 8px 6px; gap:4px} #mic{width:46px; height:46px} #mic svg{width:22px; height:22px} #text{padding:8px 12px; font-size:1rem; line-height:1.7} .btn{padding:5px 9px; font-size:.8125rem} .count{display:none} }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="btn" type="button" id="open-docs" aria-label="원고 목록">목록</button>
    <input id="title" type="text" maxlength="60" placeholder="제목" aria-label="원고 제목" autocomplete="off">
    <div class="count" id="count" aria-live="off">0자</div>
  </div>
  <div class="note" id="note" role="status" hidden></div>
  <textarea id="text" aria-label="원고" placeholder="아래 마이크를 누르고 말해 보세요. 직접 입력해도 됩니다." spellcheck="false"></textarea>
  <div class="interim" id="interim" aria-live="off"><span></span></div>
  <div class="bar">
    <div class="side">
      <button class="btn" type="button" id="undo" disabled>방금 말한 것 지우기</button>
    </div>
    <button type="button" id="mic" aria-pressed="false" aria-label="받아쓰기 시작">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <div class="side r">
      <button class="btn" type="button" id="nl">줄바꿈</button>
      <button class="btn" type="button" id="more">더보기</button>
    </div>
  </div>
</div>

<div class="panel" id="docs-panel" hidden>
  <div class="sheet" role="dialog" aria-label="원고 목록">
    <div class="row"><h2 style="flex:1">원고 목록</h2><button class="btn primary" type="button" id="new-doc">새 원고</button><button class="btn" type="button" id="close-docs">닫기</button></div>
    <div id="doc-list"></div>
  </div>
</div>

<div class="panel" id="more-panel" hidden>
  <div class="sheet" role="dialog" aria-label="더보기">
    <div class="row"><h2 style="flex:1">더보기</h2><button class="btn" type="button" id="close-more">닫기</button></div>
    <div class="row">
      <button class="btn" type="button" id="read">읽어 주기</button>
      <button class="btn" type="button" id="copy">전체 복사</button>
      <button class="btn" type="button" id="save-txt">파일로 저장</button>
      <button class="btn" type="button" id="share" hidden>공유</button>
    </div>
    <label class="row" for="cmd-on" style="font-size:.9375rem"><input type="checkbox" id="cmd-on" style="width:20px;height:20px;accent-color:var(--accent)"> 말로 하는 명령 사용</label>
    <ul class="help">
      <li>"줄 바꿔" → 줄바꿈, "문단 바꿔" → 빈 줄 띄우기</li>
      <li>"마침표", "쉼표", "물음표", "느낌표", "말줄임표" → 문장부호</li>
      <li>"따옴표" → 여는 따옴표와 닫는 따옴표를 번갈아 넣기</li>
      <li>"지워" 한마디만 말하면 방금 말한 것을 지우기</li>
    </ul>
    <p style="font-size:.8125rem;color:var(--muted);margin:0">원고는 이 기기에만 저장됩니다. 음성 인식은 브라우저 기능을 쓰며, 브라우저에 따라 음성이 인식 서버로 전송될 수 있습니다.</p>
  </div>
</div>

<script>
// <logic>
var PUNCT = '', NL = '', QUOTE = '';
var CMD_RULES = [
  [/(^|\s)(문단\s?바꿔|문단\s?바꿈|새\s?문단)(?=\s|$)/g, NL + '\n\n' + NL],
  [/(^|\s)(줄\s?바꿔|줄\s?바꿈|다음\s?줄)(?=\s|$)/g, NL + '\n' + NL],
  [/(^|\s)말\s?줄임표(?=\s|$)/g, PUNCT + '…'],
  [/(^|\s)마침표(?=\s|$)/g, PUNCT + '.'],
  [/(^|\s)쉼표(?=\s|$)/g, PUNCT + ','],
  [/(^|\s)물음표(?=\s|$)/g, PUNCT + '?'],
  [/(^|\s)느낌표(?=\s|$)/g, PUNCT + '!'],
  [/(^|\s)(큰\s?)?따옴표(?=\s|$)/g, QUOTE]
];
// 말한 문장을 원고에 넣을 글로 바꾼다. quoteOpen: 지금 따옴표가 열려 있는지.
// 반환 { text, undo }  undo가 true면 "지워" 명령.
function applyCommands(raw, quoteOpen, enabled) {
  var s = String(raw || '').replace(/\s+/g, ' ').trim();
  if (!enabled) return { text: s, undo: false };
  if (/^(방금\s?(거|것)\s?)?지워(\s?줘)?$/.test(s) || /^마지막\s?문장\s?지워(\s?줘)?$/.test(s)) return { text: '', undo: true };
  CMD_RULES.forEach(function (r) { s = s.replace(r[0], function (m, pre) { return pre + r[1]; }); });
  var out = '', open = !!quoteOpen;
  s.split(QUOTE).forEach(function (part, i) {
    if (i > 0) {
      if (open) { out = out.replace(/\s+$/, '') + '"'; }          // 닫는 따옴표: 앞말에 붙인다
      else { out += (out && !/\s$/.test(out) ? ' ' : '') + '"'; part = part.replace(/^\s+/, ''); }  // 여는 따옴표: 뒷말에 붙인다
      open = !open;
    }
    out += part;
  });
  out = out.replace(new RegExp('\\s*' + PUNCT, 'g'), '').replace(new RegExp('[ \\t]*' + NL + '[ \\t]*', 'g'), '');
  return { text: out.replace(/^ +| +$/g, ''), undo: false };
}
// 원고의 pos 위치에 ins를 넣을 때 앞에 띄어쓰기가 필요한지
function needsSpace(before, ins) {
  if (!before || !ins) return false;
  var prev = before.charAt(before.length - 1);
  if (/\s/.test(prev)) return false;
  if (/^[.,?!…\n]/.test(ins)) return false;
  var open = (before.split('"').length - 1) % 2 === 1;
  if (prev === '"' && open) return false;          // 방금 연 따옴표 바로 뒤
  if (ins.charAt(0) === '"' && open) return false; // 닫는 따옴표로 시작
  return true;
}
function countChars(t) { return { all: t.length, noSpace: t.replace(/\s/g, '').length }; }
// </logic>

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ta = $('text'), titleEl = $('title');
  var K = { index: 'malsseugi-index', doc: 'malsseugi-doc-', cur: 'malsseugi-current', cmd: 'malsseugi-cmd' };
  var index = [], curId = null, caret = 0, undoStack = [], confirmDel = null;

  function get(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { note('저장하지 못했습니다. 기기의 저장 공간을 확인해 주세요.', true); return false; } }
  function note(msg, bad) { var n = $('note'); n.textContent = msg || ''; n.hidden = !msg; n.className = 'note' + (bad ? ' bad' : ''); }
  function fmtDate(ts) { var d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  // ---------- 원고 저장 ----------
  function loadIndex() { try { index = JSON.parse(get(K.index, '[]')) || []; } catch (e) { index = []; } if (!Array.isArray(index)) index = []; }
  function meta(id) { for (var i = 0; i < index.length; i++) if (index[i].id === id) return index[i]; return null; }
  var saveTimer = null;
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    var m = meta(curId); if (!m) return;
    m.title = titleEl.value.trim(); m.updated = Date.now(); m.chars = ta.value.length;
    if (set(K.doc + curId, ta.value)) set(K.index, JSON.stringify(index));
  }
  function saveSoon() { if (!saveTimer) saveTimer = setTimeout(saveNow, 600); }
  function openDoc(id) {
    saveNow();
    curId = id; set(K.cur, id);
    var m = meta(id);
    titleEl.value = m.title || ''; ta.value = get(K.doc + id, ''); caret = ta.value.length; undoStack = []; refresh();
  }
  function newDoc() {
    saveNow();
    var id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    index.unshift({ id: id, title: '', updated: Date.now(), chars: 0 });
    set(K.index, JSON.stringify(index)); set(K.doc + id, '');
    curId = null; openDoc(id);
  }
  function refresh() {
    var c = countChars(ta.value);
    $('count').textContent = c.all.toLocaleString('ko-KR') + '자\n공백 제외 ' + c.noSpace.toLocaleString('ko-KR');
    $('count').style.whiteSpace = 'pre';
    $('undo').disabled = !undoStack.length;
  }
  function renderDocs() {
    var box = $('doc-list'); box.textContent = '';
    index.slice().sort(function (a, b) { return b.updated - a.updated; }).forEach(function (m) {
      var row = document.createElement('div'); row.className = 'doc' + (m.id === curId ? ' cur' : '');
      var g = document.createElement('div'); g.className = 'grow';
      var t = document.createElement('div'); t.className = 't'; t.textContent = m.title || '제목 없는 원고';
      var s = document.createElement('div'); s.className = 'm'; s.textContent = (m.chars || 0).toLocaleString('ko-KR') + '자 · ' + fmtDate(m.updated);
      g.appendChild(t); g.appendChild(s); row.appendChild(g);
      var o = document.createElement('button'); o.className = 'btn'; o.type = 'button'; o.textContent = m.id === curId ? '쓰는 중' : '열기'; o.disabled = m.id === curId;
      o.addEventListener('click', function () { openDoc(m.id); $('docs-panel').hidden = true; });
      var d = document.createElement('button'); d.className = 'btn danger'; d.type = 'button'; d.textContent = confirmDel === m.id ? '한 번 더' : '삭제';
      d.setAttribute('aria-label', (m.title || '제목 없는 원고') + ' 삭제');
      d.addEventListener('click', function () {
        if (confirmDel !== m.id) { confirmDel = m.id; renderDocs(); return; }
        confirmDel = null;
        index = index.filter(function (x) { return x.id !== m.id; });
        try { localStorage.removeItem(K.doc + m.id); } catch (e) {}
        set(K.index, JSON.stringify(index));
        if (m.id === curId) { curId = null; if (index.length) openDoc(index[0].id); else newDoc(); }
        renderDocs();
      });
      row.appendChild(o); row.appendChild(d); box.appendChild(row);
    });
  }

  // ---------- 원고에 넣기 ----------
  function trackCaret() { caret = ta.selectionStart; }
  ['keyup', 'click', 'select', 'focus', 'touchend'].forEach(function (ev) { ta.addEventListener(ev, trackCaret); });
  ta.addEventListener('input', function () { trackCaret(); undoStack = []; refresh(); saveSoon(); });
  titleEl.addEventListener('input', saveSoon);
  function insert(str) {
    if (!str) return;
    var v = ta.value, pos = Math.min(caret, v.length), before = v.slice(0, pos);
    if (needsSpace(before, str)) str = ' ' + str;
    ta.value = before + str + v.slice(pos);
    undoStack.push({ pos: pos, str: str }); if (undoStack.length > 50) undoStack.shift();
    caret = pos + str.length;
    try { ta.setSelectionRange(caret, caret); } catch (e) {}
    if (caret >= ta.value.length - 1) ta.scrollTop = ta.scrollHeight;
    refresh(); saveSoon();
  }
  function undoLast() {
    var u = undoStack.pop(); if (!u) return;
    var v = ta.value;
    if (v.substr(u.pos, u.str.length) !== u.str) { undoStack = []; note('그 뒤에 원고를 고쳐서 되돌릴 수 없습니다.'); refresh(); return; }
    ta.value = v.slice(0, u.pos) + v.slice(u.pos + u.str.length); caret = u.pos;
    try { ta.setSelectionRange(caret, caret); } catch (e) {}
    refresh(); saveSoon();
  }
  function commit(transcript) {
    var before = ta.value.slice(0, Math.min(caret, ta.value.length));
    var open = (before.split('"').length - 1) % 2 === 1;
    var r = applyCommands(transcript, open, $('cmd-on').checked);
    if (r.undo) undoLast(); else insert(r.text);
  }

  // ---------- 받아쓰기 ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, quickEnds = 0, lastStart = 0, heard = false, wake = null;
  var isAndroid = /Android/i.test(navigator.userAgent);
  function micUi() {
    var b = $('mic'); b.classList.toggle('on', listening); b.setAttribute('aria-pressed', String(listening));
    b.setAttribute('aria-label', listening ? '받아쓰기 멈추기' : '받아쓰기 시작'); ta.classList.toggle('live', listening);
    if (!listening) $('interim').firstChild.textContent = '';
  }
  function spawn() {
    rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.continuous = !isAndroid;   // 안드로이드는 연속 모드에서 같은 말이 겹쳐 들어오는 문제가 있어, 한 문장씩 받고 다시 시작한다
    rec.onresult = function (e) {
      heard = true;
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) commit(r[0].transcript); else interim += r[0].transcript;
      }
      $('interim').firstChild.textContent = interim;
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { listening = false; note('마이크 권한이 필요합니다. 브라우저 주소창의 사이트 설정에서 마이크를 허용해 주세요.', true); }
      else if (e.error === 'network') { listening = false; note('음성 인식 서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.', true); }
      else if (e.error === 'audio-capture') { listening = false; note('마이크를 찾지 못했습니다.', true); }
      micUi();
    };
    rec.onend = function () {
      $('interim').firstChild.textContent = '';
      if (!listening) { micUi(); releaseWake(); return; }
      quickEnds = !heard && Date.now() - lastStart < 400 ? quickEnds + 1 : 0;   // 아무것도 못 듣고 바로 끊기는 일이 반복될 때만 멈춘다
      if (quickEnds >= 5) { listening = false; micUi(); releaseWake(); note('받아쓰기가 계속 끊깁니다. 잠시 후 다시 눌러 주세요.', true); return; }
      setTimeout(function () { if (listening) { try { spawn(); } catch (err) { listening = false; micUi(); } } }, 120);
    };
    lastStart = Date.now(); heard = false;
    rec.start();
  }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
  function startListening() {
    if (!SR) { note('이 브라우저는 음성 인식을 지원하지 않습니다. 크롬이나 삼성 인터넷에서 열어 주세요.', true); return; }
    stopReading(); note(''); listening = true; quickEnds = 0;
    try { spawn(); } catch (e) { listening = false; note('받아쓰기를 시작하지 못했습니다.', true); }
    micUi();
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {}); } catch (e) {}
  }
  function stopListening() { listening = false; try { rec && rec.stop(); } catch (e) {} micUi(); releaseWake(); saveNow(); }
  $('mic').addEventListener('click', function () { if (listening) stopListening(); else startListening(); });
  $('undo').addEventListener('click', undoLast);
  $('nl').addEventListener('click', function () { insert('\n'); });

  // ---------- 읽어 주기 ----------
  var reading = false;
  function stopReading() { if (!reading) return; reading = false; try { speechSynthesis.cancel(); } catch (e) {} $('read').textContent = '읽어 주기'; }
  $('read').addEventListener('click', function () {
    if (reading) { stopReading(); return; }
    if (!('speechSynthesis' in window)) { note('이 브라우저는 읽어 주기를 지원하지 않습니다.', true); return; }
    var sel = ta.value.slice(ta.selectionStart, ta.selectionEnd), text = (sel.trim() ? sel : ta.value).trim();
    if (!text) { note('읽을 내용이 없습니다.'); return; }
    if (listening) stopListening();
    var parts = text.split(/\n+/).filter(function (p) { return p.trim(); });
    reading = true; $('read').textContent = '읽기 멈추기'; $('more-panel').hidden = true;
    parts.forEach(function (p, i) {
      var u = new SpeechSynthesisUtterance(p); u.lang = 'ko-KR';
      if (i === parts.length - 1) u.onend = function () { reading = false; $('read').textContent = '읽어 주기'; };
      speechSynthesis.speak(u);
    });
  });

  // ---------- 내보내기 ----------
  function fileName() { return (titleEl.value.trim() || '원고').replace(/[\\/:*?"<>|]/g, '_') + '.txt'; }
  $('copy').addEventListener('click', function () {
    var ok = function () { note('원고 전체를 복사했습니다.'); $('more-panel').hidden = true; };
    var legacy = function () { try { ta.focus(); ta.select(); if (document.execCommand('copy')) ok(); else note('복사하지 못했습니다. 원고를 길게 눌러 직접 복사해 주세요.', true); } catch (e) { note('복사하지 못했습니다.', true); } };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, legacy); else legacy(); } catch (e) { legacy(); }
  });
  $('save-txt').addEventListener('click', function () {
    try {
      var url = URL.createObjectURL(new Blob([ta.value], { type: 'text/plain;charset=utf-8' }));
      var a = document.createElement('a'); a.href = url; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      note('"' + fileName() + '" 파일로 저장했습니다.'); $('more-panel').hidden = true;
    } catch (e) { note('파일로 저장하지 못했습니다.', true); }
  });
  if (navigator.share) {
    $('share').hidden = false;
    $('share').addEventListener('click', function () { navigator.share({ title: titleEl.value.trim() || '원고', text: ta.value }).catch(function () {}); });
  }

  // ---------- 패널 ----------
  $('open-docs').addEventListener('click', function () { saveNow(); confirmDel = null; renderDocs(); $('docs-panel').hidden = false; });
  $('close-docs').addEventListener('click', function () { $('docs-panel').hidden = true; });
  $('new-doc').addEventListener('click', function () { newDoc(); $('docs-panel').hidden = true; titleEl.focus(); });
  $('more').addEventListener('click', function () { $('more-panel').hidden = false; });
  $('close-more').addEventListener('click', function () { $('more-panel').hidden = true; });
  ['docs-panel', 'more-panel'].forEach(function (id) { $(id).addEventListener('click', function (e) { if (e.target === this) this.hidden = true; }); });
  $('cmd-on').checked = get(K.cmd, '1') === '1';
  $('cmd-on').addEventListener('change', function () { set(K.cmd, this.checked ? '1' : '0'); });

  document.addEventListener('visibilitychange', function () { if (document.hidden) { saveNow(); if (listening) stopListening(); } });
  window.addEventListener('pagehide', saveNow);

  // ---------- 시작 ----------
  loadIndex();
  var last = get(K.cur, '');
  if (meta(last)) openDoc(last); else if (index.length) openDoc(index[0].id); else newDoc();
  micUi();
  if (!SR) note('이 브라우저는 음성 인식을 지원하지 않습니다. 크롬이나 삼성 인터넷에서 열면 말로 쓸 수 있습니다. 직접 입력은 지금도 됩니다.');
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
})();
</script>
</body>
</html>
